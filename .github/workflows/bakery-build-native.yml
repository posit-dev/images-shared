# Worklows can only be nested four levels deep.
# This workflow will be called to build individual images so should be kept
# as shallow as possible.

name: Bakery

on:
  workflow_call:
    inputs:
      version:
        description: "The version of the Posit Bakery tool to install"
        default: "main"
        required: false
        type: string
      context:
        description: "The Bakery context to use (directory)"
        default: "."
        required: false
        type: string
      dev-versions:
        description: "Dev version builds [default: exclude] [options: include, exclude, only]"
        default: "exclude"
        required: false
        type: string
      matrix-versions:
        description: "Matrix version builds [default: exclude] [options: include, exclude, only]"
        default: "exclude"
        required: false
        type: string
      image-name:
        description: "Filter to a specific image name or pattern (e.g., 'workbench', '^workbench$')"
        default: ""
        required: false
        type: string
      image-version:
        description: "Filter to a specific image version. A leading 'v' is stripped automatically."
        default: ""
        required: false
        type: string
      dev-channel:
        description: "Filter dev versions to a specific release channel (e.g. 'daily', 'preview')"
        default: ""
        required: false
        type: string
      dev-stream:
        description: "Deprecated: use dev-channel instead."
        default: ""
        required: false
        type: string
      dev-version:
        description: "Pinned dev version string for a dispatched build. Used with dev-channel to construct dev-spec."
        default: ""
        required: false
        type: string
      release-branch:
        description: "Workbench dailies release branch for dev builds (e.g. 'apple-blossom', '2026.07'). Omit to use 'latest'."
        default: ""
        required: false
        type: string
      dev-spec:
        description: "JSON spec for a dispatched dev build. If set, takes precedence over dev-version/dev-channel for spec construction."
        default: ""
        required: false
        type: string
      push:
        description: "Whether to push images to registries [default: false]"
        default: false
        required: false
        type: boolean
      retry:
        description: "Number of times to retry a failed build [default: 1]"
        default: 1
        required: false
        type: number
      cache:
        description: "Whether to use registry caching for builds [default: true]"
        default: true
        required: false
        type: boolean
      max-parallel:
        description: "Maximum number of matrix jobs (build/test and merge) to run simultaneously [default: 0, unlimited]"
        default: 0
        required: false
        type: number
      cache-registry:
        description: "Registry to use for build layer caching [default: ghcr.io/<repository_owner>]"
        default: ""
        required: false
        type: string
      temp-registry:
        description: "Registry to use for temporary per-platform build artifacts before merge [default: ghcr.io/<repository_owner>]"
        default: ""
        required: false
        type: string
      merge-builder:
        description: "The type of runner to use for merging [default: ubuntu-latest-4x]"
        default: "ubuntu-latest-4x"
        required: false
        type: string
      amd64-builder:
        description: "The type of runner to use for amd64 builds [default: ubuntu-latest-4x]"
        default: "ubuntu-latest-4x"
        required: false
        type: string
      arm64-builder:
        description: "The type of runner to use for arm64 builds [default: ubuntu-24.04-arm64-4-core]"
        default: "ubuntu-24.04-arm64-4-core"
        required: false
        type: string
      aws-region:
        description: "AWS Region [default: us-east-2]"
        default: "us-east-2"
        required: false
        type: string
    secrets:
      DOCKER_HUB_ACCESS_TOKEN:
        description: "Docker Hub Access Token [required if pushing]"
        required: false
      DOCKER_HUB_README_USERNAME:
        description: "Docker Hub username for pushing READMEs (PAT required, OAT not supported)"
        required: false
      DOCKER_HUB_README_PASSWORD:
        description: "Docker Hub PAT for pushing READMEs"
        required: false
      AWS_ROLE:
        description: "AWS Role to assume [required if pushing to ECR]"
        required: false
      WIZ_CLIENT_ID:
        description: "Wiz service account client ID [required for security scanning]"
        required: false
      WIZ_CLIENT_SECRET:
        description: "Wiz service account client secret [required for security scanning]"
        required: false
      WIZ_POLICY_ID:
        description: "Wiz policy ID(s) to scope the security scan to, comma-separated [optional]"
        required: false
      WIZ_PROJECT_ID:
        description: "Wiz project ID(s) to scope the security scan to, comma-separated [optional]"
        required: false

defaults:
  run:
    shell: bash

# Security policy: No ${{ }} expressions in `run:` blocks.
# All expression values are assigned to `env:` and referenced as
# shell variables. This prevents script injection from runtime values
# (matrix outputs, secrets) and keeps the rule enforceable by zizmor
# without per-expression exceptions.

jobs:
  matrix:
    name: Image Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      platform-matrix: ${{ steps.images-by-platform.outputs.platform_matrix }}
      image-matrix: ${{ steps.images-by-platform.outputs.image_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install
        id: setup-bakery
        uses: "posit-dev/images-shared/setup-bakery@main"
        with:
          version: ${{ inputs.version }}
          cache-scope: ${{ toJSON(inputs) }}
          is-writer: "true"

      - name: Resolve dev-spec
        id: resolve-dev-spec
        env:
          DEV_SPEC: ${{ inputs.dev-spec }}
          DEV_VERSION: ${{ inputs.dev-version }}
          DEV_CHANNEL: ${{ inputs.dev-channel || inputs.dev-stream }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
        run: |
          if [[ -n "$DEV_SPEC" ]]; then
            DEV_SPEC_COMPACT=$(echo "$DEV_SPEC" | jq -c .)
            echo "dev-spec=$DEV_SPEC_COMPACT" >> "$GITHUB_OUTPUT"
          elif [[ -n "$DEV_VERSION" || -n "$RELEASE_BRANCH" ]]; then
            DEV_SPEC_JSON=$(jq -cn \
              --arg v "$DEV_VERSION" \
              --arg c "$DEV_CHANNEL" \
              --arg b "$RELEASE_BRANCH" \
              'if $v != "" then {version: $v} else {} end
               + if $c != "" then {channel: $c} else {} end
               + if $b != "" then {release_branch: $b} else {} end')
            echo "dev-spec=$DEV_SPEC_JSON" >> "$GITHUB_OUTPUT"
          else
            echo "dev-spec=" >> "$GITHUB_OUTPUT"
          fi

      - name: Images by Version/Platform
        id: images-by-platform
        env:
          DEV_VERSIONS: ${{ inputs.dev-versions }}
          MATRIX_VERSIONS: ${{ inputs.matrix-versions }}
          IMAGE_NAME_FILTER: ${{ inputs.image-name }}
          IMAGE_VERSION: ${{ inputs.image-version }}
          DEV_CHANNEL: ${{ inputs.dev-channel || inputs.dev-stream }}
          DEV_SPEC_RESOLVED: ${{ steps.resolve-dev-spec.outputs.dev-spec }}
          CONTEXT: ${{ inputs.context }}
          # Only set on push events; empty on pull_request/schedule/
          # workflow_dispatch, which intentionally always build the full matrix.
          # github.event.before is also populated on pull_request synchronize,
          # so it must be gated on event_name rather than checked for presence alone.
          # A bad or all-zero ref (e.g. a branch's first push) is caught by
          # bakery's git-diff fail-safe, which falls back to a full build.
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          IMAGE_VERSION="${IMAGE_VERSION#v}"
          ARGS=(--quiet --dev-versions "$DEV_VERSIONS" --matrix-versions "$MATRIX_VERSIONS" --context "$CONTEXT")
          [[ -n "$IMAGE_VERSION" ]] && ARGS+=(--image-version "$IMAGE_VERSION")
          [[ -n "$BASE_REF" ]] && ARGS+=(--base-ref "$BASE_REF")
          if [[ -n "$DEV_SPEC_RESOLVED" ]]; then
            ARGS+=(--dev-spec "$DEV_SPEC_RESOLVED")
          elif [[ -n "$DEV_CHANNEL" ]]; then
            ARGS+=(--dev-channel "$DEV_CHANNEL")
          fi
          [[ -n "$IMAGE_NAME_FILTER" ]] && ARGS+=(-- "$IMAGE_NAME_FILTER")
          result=$(bakery ci matrix "${ARGS[@]}")
          echo "platform_matrix=$(echo "$result" | jq --compact-output .)" >> "$GITHUB_OUTPUT"
          echo "image_matrix=$(echo "$result" | jq --compact-output '[.[].image] | unique')" >> "$GITHUB_OUTPUT"

      - name: Save dependency version cache
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.setup-bakery.outputs.cache-artifact-name }}
          path: /tmp/bakery_cache
          if-no-files-found: ignore
          retention-days: 1

  build-test:
    name: "Build/Test ${{ matrix.img.image }}:${{ matrix.img.version }} (${{ matrix.img.platform }})"
    permissions:
      contents: read
      packages: write
      id-token: write
    needs: matrix
    # GitHub Actions fails (not skips) a matrix job when the matrix evaluates to [].
    # Guard here so an empty change-aware matrix (a push with nothing to build)
    # produces 'skipped' instead of 'failure'.
    if: ${{ needs.matrix.outputs.platform-matrix != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel > 0 && inputs.max-parallel || 256 }}
      matrix:
        img: ${{ fromJson(needs.matrix.outputs.platform-matrix) }}
    runs-on: ${{ matrix.img.platform == 'linux/arm64' && inputs.arm64-builder || inputs.amd64-builder }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bakery
        uses: "posit-dev/images-shared/setup-bakery@main"
        with:
          version: ${{ inputs.version }}
          cache-scope: ${{ toJSON(inputs) }}

      - name: Setup goss
        uses: "posit-dev/images-shared/setup-goss@main"

      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1  # v5.4.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Setup docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Setup ORAS CLI
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1

      # Since secrets cannot be referenced in an `if` condition directly,
      # this step sets an output that we can reference later.
      - name: Filter Steps
        id: filter-steps
        env:
          HAS_DOCKER_HUB: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN != '' }}
          HAS_AWS_ROLE: ${{ secrets.AWS_ROLE != '' }}
          HAS_WIZ_AUTH: ${{ secrets.WIZ_CLIENT_ID != '' }}
        run: |
          {
            echo "docker-hub=$HAS_DOCKER_HUB"
            echo "ecr=$HAS_AWS_ROLE"
            echo "wiz-auth=$HAS_WIZ_AUTH"
          } >> "$GITHUB_OUTPUT"

      - name: Setup wizcli
        if: ${{ inputs.push && steps.filter-steps.outputs.wiz-auth == 'true' }}
        uses: "posit-dev/images-shared/setup-wizcli@main"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ inputs.push && steps.filter-steps.outputs.docker-hub == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: "posit"
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Not gated on inputs.push: the Build step below always pushes the
      # per-platform temp image (and the merge job always pulls it back),
      # regardless of whether this run pushes final product images. If
      # temp-registry points at ECR, login must happen on every run.
      - name: Configure AWS Credentials
        if: ${{ steps.filter-steps.outputs.ecr == 'true' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        if: ${{ steps.filter-steps.outputs.ecr == 'true' }}
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6

      - name: Normalize platform
        id: normalize-platform
        env:
          BUILD_PLATFORM: ${{ matrix.img.platform }}
        run: |
          PLATFORM=${BUILD_PLATFORM#linux/}
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
      - name: Resolve dev-spec
        id: resolve-dev-spec
        env:
          DEV_SPEC: ${{ inputs.dev-spec }}
          DEV_VERSION: ${{ inputs.dev-version }}
          DEV_CHANNEL: ${{ inputs.dev-channel || inputs.dev-stream }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
        run: |
          if [[ -n "$DEV_SPEC" ]]; then
            DEV_SPEC_COMPACT=$(echo "$DEV_SPEC" | jq -c .)
            echo "dev-spec=$DEV_SPEC_COMPACT" >> "$GITHUB_OUTPUT"
          elif [[ -n "$DEV_VERSION" || -n "$RELEASE_BRANCH" ]]; then
            DEV_SPEC_JSON=$(jq -cn \
              --arg v "$DEV_VERSION" \
              --arg c "$DEV_CHANNEL" \
              --arg b "$RELEASE_BRANCH" \
              'if $v != "" then {version: $v} else {} end
               + if $c != "" then {channel: $c} else {} end
               + if $b != "" then {release_branch: $b} else {} end')
            echo "dev-spec=$DEV_SPEC_JSON" >> "$GITHUB_OUTPUT"
          else
            echo "dev-spec=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        env:
          GIT_SHA: ${{ github.sha }}
          RETRY: ${{ inputs.retry }}
          IMAGE_NAME: ${{ matrix.img.image }}
          IMAGE_VERSION: ${{ matrix.img.version }}
          IMAGE_PLATFORM: ${{ matrix.img.platform }}
          DEV_VERSIONS: ${{ inputs.dev-versions }}
          MATRIX_VERSIONS: ${{ inputs.matrix-versions }}
          DEV_SPEC_RESOLVED: ${{ steps.resolve-dev-spec.outputs.dev-spec }}
          CACHE_REGISTRY: ${{ inputs.cache-registry || format('ghcr.io/{0}', github.repository_owner) }}
          TEMP_REGISTRY: ${{ inputs.temp-registry || format('ghcr.io/{0}', github.repository_owner) }}
          NORMALIZED_PLATFORM: ${{ steps.normalize-platform.outputs.platform }}
          CONTEXT: ${{ inputs.context }}
          CACHE: ${{ inputs.cache }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Cache-to is conditional on --push (handled by bakery internally)
        run: |
          CACHE_FLAGS=()
          if [ "$CACHE" = "true" ]; then
            CACHE_FLAGS=(--cache-registry "$CACHE_REGISTRY")
          fi
          DEV_SPEC_FLAGS=()
          [[ -n "$DEV_SPEC_RESOLVED" ]] && DEV_SPEC_FLAGS=(--dev-spec "$DEV_SPEC_RESOLVED")
          bakery build \
            --strategy build --pull \
            --retry "$RETRY" \
            --image-name "^${IMAGE_NAME}$" \
            --image-version "$IMAGE_VERSION" \
            --image-platform "$IMAGE_PLATFORM" \
            --dev-versions "$DEV_VERSIONS" \
            --matrix-versions "$MATRIX_VERSIONS" \
            "${CACHE_FLAGS[@]}" \
            "${DEV_SPEC_FLAGS[@]}" \
            --temp-registry "$TEMP_REGISTRY" \
            --metadata-file "./${IMAGE_NAME}-${IMAGE_VERSION}-${NORMALIZED_PLATFORM}-metadata.json" \
            --context "$CONTEXT" \
            --push \
            --summary --summary-format json \
            > "./${IMAGE_NAME}-${IMAGE_VERSION}-${NORMALIZED_PLATFORM}-summary.json"
      # Distinguishes this call's artifacts from a sibling call's when a caller invokes
      # this workflow more than once in the same run (e.g. separate production/development
      # calls with different `with:` values) -- artifacts are scoped to the run, not to
      # the invocation, so without this the summary job of each call would download the
      # other's artifacts too. Same technique `cache-scope: ${{ toJSON(inputs) }}` already
      # uses elsewhere in this file, just hashed into a name-safe token.
      - name: Compute artifact scope
        id: artifact-scope
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          echo "hash=$(printf '%s' "$INPUTS_JSON" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Upload Build Summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "${{ steps.artifact-scope.outputs.hash }}-${{ matrix.img.image }}-${{ matrix.img.version }}-${{ steps.normalize-platform.outputs.platform }}-summary"
          path: "./${{ matrix.img.image }}-${{ matrix.img.version }}-${{ steps.normalize-platform.outputs.platform }}-summary.json"
          retention-days: 3
          overwrite: 'true'
      - name: Test
        env:
          IMAGE_NAME: ${{ matrix.img.image }}
          IMAGE_VERSION: ${{ matrix.img.version }}
          IMAGE_PLATFORM: ${{ matrix.img.platform }}
          DEV_VERSIONS: ${{ inputs.dev-versions }}
          MATRIX_VERSIONS: ${{ inputs.matrix-versions }}
          DEV_SPEC_RESOLVED: ${{ steps.resolve-dev-spec.outputs.dev-spec }}
          NORMALIZED_PLATFORM: ${{ steps.normalize-platform.outputs.platform }}
          CONTEXT: ${{ inputs.context }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEV_SPEC_FLAGS=()
          [[ -n "$DEV_SPEC_RESOLVED" ]] && DEV_SPEC_FLAGS=(--dev-spec "$DEV_SPEC_RESOLVED")
          GOSS_PATH=${GITHUB_WORKSPACE}/tools/goss \
          DGOSS_PATH=${GITHUB_WORKSPACE}/tools/dgoss \
          bakery dgoss run \
            --image-name "^${IMAGE_NAME}$" \
            --image-version "$IMAGE_VERSION" \
            --image-platform "$IMAGE_PLATFORM" \
            --dev-versions "$DEV_VERSIONS" \
            --matrix-versions "$MATRIX_VERSIONS" \
            "${DEV_SPEC_FLAGS[@]}" \
            --metadata-file "./${IMAGE_NAME}-${IMAGE_VERSION}-${NORMALIZED_PLATFORM}-metadata.json" \
            --context "$CONTEXT"
      # Runs after Test on purpose. Every target of an image builds to the same
      # tagless temp name, so the `--load` of each build overwrites the previous
      # one and only the last target stays addressable in the local daemon. The
      # `docker run` in Test pulls each target by digest, which registers a
      # name-free `repo@sha256:...` entry per target -- all of them coexist,
      # unlike tags. wizcli's `extract` driver reads the local store, so it can
      # only resolve every target once Test has warmed it.
      # Production builds scan only the latest version of each image, now that the
      # backlog has been scanned once; development builds keep scanning every push.
      # Gated here rather than by passing `--latest` to the scan: this job is already
      # pinned to one version, so `--latest` combined with that pin resolved to an
      # empty target set on every non-latest version and exited 1, which
      # continue-on-error then hid behind a red annotation on an otherwise green job.
      # matrix.img.latest comes from `bakery ci matrix`, so the "is this the latest
      # version" decision is made once, in one place.
      - name: Wiz Scan
        if: ${{ inputs.push && steps.filter-steps.outputs.wiz-auth == 'true'
                && (inputs.dev-versions == 'only' || matrix.img.latest) }}
        continue-on-error: true
        env:
          IMAGE_NAME: ${{ matrix.img.image }}
          IMAGE_VERSION: ${{ matrix.img.version }}
          IMAGE_PLATFORM: ${{ matrix.img.platform }}
          DEV_VERSIONS: ${{ inputs.dev-versions }}
          MATRIX_VERSIONS: ${{ inputs.matrix-versions }}
          DEV_SPEC_RESOLVED: ${{ steps.resolve-dev-spec.outputs.dev-spec }}
          NORMALIZED_PLATFORM: ${{ steps.normalize-platform.outputs.platform }}
          CONTEXT: ${{ inputs.context }}
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
          WIZ_POLICY_ID: ${{ secrets.WIZ_POLICY_ID }}
          WIZ_PROJECT_ID: ${{ secrets.WIZ_PROJECT_ID }}
        run: |
          DEV_SPEC_FLAGS=()
          [[ -n "$DEV_SPEC_RESOLVED" ]] && DEV_SPEC_FLAGS=(--dev-spec "$DEV_SPEC_RESOLVED")
          POLICY_FLAGS=()
          [[ -n "$WIZ_POLICY_ID" ]] && POLICY_FLAGS=(--policies "$WIZ_POLICY_ID")
          PROJECT_FLAGS=()
          [[ -n "$WIZ_PROJECT_ID" ]] && PROJECT_FLAGS=(--projects "$WIZ_PROJECT_ID")
          WIZCLI_PATH=${GITHUB_WORKSPACE}/tools/wizcli \
          bakery wizcli scan \
            --image-name "^${IMAGE_NAME}$" \
            --image-version "$IMAGE_VERSION" \
            --image-platform "$IMAGE_PLATFORM" \
            --dev-versions "$DEV_VERSIONS" \
            --matrix-versions "$MATRIX_VERSIONS" \
            "${DEV_SPEC_FLAGS[@]}" \
            "${POLICY_FLAGS[@]}" \
            "${PROJECT_FLAGS[@]}" \
            --metadata-file "./${IMAGE_NAME}-${IMAGE_VERSION}-${NORMALIZED_PLATFORM}-metadata.json" \
            --context "$CONTEXT"

      - name: Setup trivy
        if: ${{ inputs.push && matrix.img.latest }}
        uses: "posit-dev/images-shared/setup-trivy@main"

      # After Test for the same reason the Wiz scan is: only Test's `docker run`
      # makes every target addressable locally. Scanning earlier silently pulled
      # and scanned the published image instead of the one just built.
      - name: Trivy Scan
        if: ${{ inputs.push && matrix.img.latest }}
        continue-on-error: true
        env:
          IMAGE_NAME: ${{ matrix.img.image }}
          IMAGE_VERSION: ${{ matrix.img.version }}
          DEV_VERSIONS: ${{ inputs.dev-versions }}
          MATRIX_VERSIONS: ${{ inputs.matrix-versions }}
          NORMALIZED_PLATFORM: ${{ steps.normalize-platform.outputs.platform }}
          CONTEXT: ${{ inputs.context }}
        run: |
          bakery trivy scan \
            --image-name "^${IMAGE_NAME}$" \
            --image-version "$IMAGE_VERSION" \
            --image-platform "$NORMALIZED_PLATFORM" \
            --dev-versions "$DEV_VERSIONS" \
            --matrix-versions "$MATRIX_VERSIONS" \
            --metadata-file "./${IMAGE_NAME}-${IMAGE_VERSION}-${NORMALIZED_PLATFORM}-metadata.json" \
            --context "$CONTEXT"

      - name: Upload Metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "${{ matrix.img.image }}-${{ matrix.img.version }}-${{ steps.normalize-platform.outputs.platform }}-metadata"
          path: "./${{ matrix.img.image }}-${{ matrix.img.version }}-${{ steps.normalize-platform.outputs.platform }}-metadata.json"
          overwrite: 'true'

  merge:
    name: "Merge/Push ${{ matrix.image }}"
    permissions:
      contents: read
      packages: write
      id-token: write
    needs: [matrix, build-test]
    # GitHub Actions fails (not skips) a matrix job when the matrix evaluates to [].
    # Guard here so an empty change-aware matrix (a push with nothing to build)
    # produces 'skipped' instead of 'failure'.
    if: ${{ needs.matrix.outputs.image-matrix != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel > 0 && inputs.max-parallel || 256 }}
      matrix:
        image: ${{ fromJson(needs.matrix.outputs.image-matrix) }}
    runs-on: ${{ inputs.merge-builder }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bakery
        uses: "posit-dev/images-shared/setup-bakery@main"
        with:
          version: ${{ inputs.version }}
          cache-scope: ${{ toJSON(inputs) }}

      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1  # v5.4.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      # Since secrets cannot be referenced in an `if` condition directly,
      # this step sets an output that we can reference later.
      - name: Filter Steps
        id: filter-steps
        env:
          HAS_DOCKER_HUB: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN != '' }}
          HAS_AWS_ROLE: ${{ secrets.AWS_ROLE != '' }}
        run: |
          echo "docker-hub=$HAS_DOCKER_HUB" >> "$GITHUB_OUTPUT"
          echo "ecr=$HAS_AWS_ROLE" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ inputs.push && steps.filter-steps.outputs.docker-hub == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: "posit"
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Not gated on inputs.push: the Build step below always pushes the
      # per-platform temp image (and the merge job always pulls it back),
      # regardless of whether this run pushes final product images. If
      # temp-registry points at ECR, login must happen on every run.
      - name: Configure AWS Credentials
        if: ${{ steps.filter-steps.outputs.ecr == 'true' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        if: ${{ steps.filter-steps.outputs.ecr == 'true' }}
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64  # v2.1.6

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Setup ORAS CLI
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1

      - name: Setup SOCI
        uses: "posit-dev/images-shared/setup-soci@main"

      - name: Download Metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: "*-metadata"
          merge-multiple: true

      - name: List files
        run: |
          ls -ltra .

      - name: Resolve dev-spec
        id: resolve-dev-spec
        env:
          DEV_SPEC: ${{ inputs.dev-spec }}
          DEV_VERSION: ${{ inputs.dev-version }}
          DEV_CHANNEL: ${{ inputs.dev-channel || inputs.dev-stream }}
          RELEASE_BRANCH: ${{ inputs.release-branch }}
        run: |
          if [[ -n "$DEV_SPEC" ]]; then
            DEV_SPEC_COMPACT=$(echo "$DEV_SPEC" | jq -c .)
            echo "dev-spec=$DEV_SPEC_COMPACT" >> "$GITHUB_OUTPUT"
          elif [[ -n "$DEV_VERSION" || -n "$RELEASE_BRANCH" ]]; then
            DEV_SPEC_JSON=$(jq -cn \
              --arg v "$DEV_VERSION" \
              --arg c "$DEV_CHANNEL" \
              --arg b "$RELEASE_BRANCH" \
              'if $v != "" then {version: $v} else {} end
               + if $c != "" then {channel: $c} else {} end
               + if $b != "" then {release_branch: $b} else {} end')
            echo "dev-spec=$DEV_SPEC_JSON" >> "$GITHUB_OUTPUT"
          else
            echo "dev-spec=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          GIT_SHA: ${{ github.sha }}
          CONTEXT: ${{ inputs.context }}
          TEMP_REGISTRY: ${{ inputs.temp-registry || format('ghcr.io/{0}', github.repository_owner) }}
          PUSH: ${{ inputs.push }}
          IMAGE_NAME: ${{ matrix.image }}
          DEV_SPEC_RESOLVED: ${{ steps.resolve-dev-spec.outputs.dev-spec }}
        run: |
          if [ "$PUSH" = "true" ]; then PUSH_FLAG=""; else PUSH_FLAG="--dry-run"; fi
          DEV_SPEC_FLAGS=()
          [[ -n "$DEV_SPEC_RESOLVED" ]] && DEV_SPEC_FLAGS=(--dev-spec "$DEV_SPEC_RESOLVED")
          bakery ci publish \
            --context "$CONTEXT" \
            --image-name "^${IMAGE_NAME}$" \
            --temp-registry "$TEMP_REGISTRY" \
            "${DEV_SPEC_FLAGS[@]}" \
            $PUSH_FLAG \
            --summary --summary-format json \
            ./*-metadata.json \
            > "./${IMAGE_NAME}-publish-summary.json"
      - name: Compute artifact scope
        id: artifact-scope
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          echo "hash=$(printf '%s' "$INPUTS_JSON" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Upload Publish Summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "${{ steps.artifact-scope.outputs.hash }}-${{ matrix.image }}-publish-summary"
          path: "./${{ matrix.image }}-publish-summary.json"
          retention-days: 3
          overwrite: 'true'

  summary:
    name: Build Summary
    permissions: {}
    needs: [matrix, build-test, merge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bakery
        uses: "posit-dev/images-shared/setup-bakery@main"
        with:
          version: ${{ inputs.version }}

      - name: Compute artifact scope
        id: artifact-scope
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          echo "hash=$(printf '%s' "$INPUTS_JSON" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Download Build Summaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: "${{ steps.artifact-scope.outputs.hash }}-*-summary"
          merge-multiple: true

      - name: Render Combined Summary
        env:
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
          MERGE_RESULT: ${{ needs.merge.result }}
        run: |
          DISCLAIMER=""
          if [ "$BUILD_TEST_RESULT" = "failure" ] || [ "$BUILD_TEST_RESULT" = "cancelled" ] \
             || [ "$MERGE_RESULT" = "failure" ] || [ "$MERGE_RESULT" = "cancelled" ]; then
            DISCLAIMER="One or more builds failed or were cancelled. This summary reflects only the targets that completed and is not a complete picture of this run."
          fi
          shopt -s nullglob
          FILES=(./*-summary.json)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No build summaries were produced for this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$DISCLAIMER" ]; then
            bakery ci summary "${FILES[@]}" --output summary.md --disclaimer "$DISCLAIMER"
          else
            bakery ci summary "${FILES[@]}" --output summary.md
          fi
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

  readme:
    name: Push READMEs
    permissions:
      contents: read
    # No explicit skip-if-merge-skipped check needed: a bare `if:` that doesn't
    # call a status function implicitly gets success() prepended, and GitHub
    # Actions treats a skipped `needs` job as failing success() — so this
    # already skips when merge is skipped (e.g. an empty change-aware matrix).
    if: ${{ inputs.push }}
    needs:
      - merge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Restores the shared cache like every other job but never saves it:
      # bakery ci readme has no --image-name filter and always resolves
      # every image in bakery.yaml, so its results aren't a subset of what
      # matrix already covered. It's also last in the job DAG, so nothing
      # would ever restore a save from here anyway.
      - name: Setup bakery
        uses: "posit-dev/images-shared/setup-bakery@main"
        with:
          version: ${{ inputs.version }}
          cache-scope: ${{ toJSON(inputs) }}

      - name: Push READMEs to Docker Hub
        env:
          DOCKER_HUB_README_USERNAME: ${{ secrets.DOCKER_HUB_README_USERNAME }}
          DOCKER_HUB_README_PASSWORD: ${{ secrets.DOCKER_HUB_README_PASSWORD }}
          CONTEXT: ${{ inputs.context }}
          DEV_VERSIONS: ${{ inputs.dev-versions }}
          MATRIX_VERSIONS: ${{ inputs.matrix-versions }}
        run: |
          bakery ci readme \
            --context "$CONTEXT" \
            --dev-versions "$DEV_VERSIONS" \
            --matrix-versions "$MATRIX_VERSIONS"
