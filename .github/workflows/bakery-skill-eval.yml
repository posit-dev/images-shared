name: Bakery Skill Eval

on:
  pull_request:
    paths:
      - "plugins/bakery/skills/bakery/**"
  push:
    branches:
      - main
    paths:
      - "plugins/bakery/skills/bakery/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  eval:
    name: Eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false

      - name: Install dependencies
        working-directory: plugins/bakery/skills/bakery/evals
        run: uv sync

      - name: Run evals
        working-directory: plugins/bakery/skills/bakery/evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run inspect eval task.py --model anthropic/claude-sonnet-4-6

      - name: Upload eval logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-logs
          path: plugins/bakery/skills/bakery/evals/logs/
          retention-days: 7
          if-no-files-found: ignore
