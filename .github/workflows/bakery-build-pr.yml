# Fork-safe PR build workflow for Posit container images.
#
# Unlike bakery-build-native.yml this workflow never pushes images.
# Fork PRs get a read-only GITHUB_TOKEN with no access to repo secrets,
# so registry logins and caching are conditional on the PR source.
#
# Security policy: No ${{ }} expressions in `run:` blocks.
# All expression values are assigned to `env:` and referenced as
# shell variables. This prevents script injection from runtime values
# (matrix outputs, secrets) and keeps the rule enforceable by zizmor
# without per-expression exceptions.

name: Bakery PR Build

on:
  workflow_call:
    inputs:
      version:
        description: "Bakery version to install"
        default: "main"
        required: false
        type: string
      context:
        description: "Path to the bakery context"
        default: "."
        required: false
        type: string
      dev-versions:
        description: "Whether to include development versions [default: exclude]"
        default: "exclude"
        required: false
        type: string
      matrix-versions:
        description: "Whether to include matrix versions [default: exclude]"
        default: "exclude"
        required: false
        type: string
      retry:
        description: "Number of times to retry a failed build"
        default: 1
        required: false
        type: number
      cache:
        description: "Whether to use registry caching for builds [default: true]"
        default: true
        required: false
        type: boolean
      cache-registry:
        description: "Registry to use for build layer caching [default: ghcr.io/<repository_owner>]"
        default: ""
        required: false
        type: string
      amd64-builder:
        description: "Runner label for amd64 builds"
        default: "ubuntu-latest-4x"
        required: false
        type: string
      arm64-builder:
        description: "Runner label for arm64 builds"
        default: "ubuntu-24.04-arm64-4-core"
        required: false
        type: string
    # NO secrets section — only inherited GITHUB_TOKEN

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect Fork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      is-fork: ${{ steps.check.outputs.is-fork }}
    steps:
      - name: Check fork status
        id: check
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: echo "is-fork=$IS_FORK" >> "$GITHUB_OUTPUT"

  matrix:
    name: Image Matrix
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      platform-matrix: ${{ steps.images-by-platform.outputs.platform_matrix }}
      versions-matrix: ${{ steps.images-by-version.outputs.versions_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install
        id: setup-bakery
        uses: "posit-dev/images-shared/setup-bakery@main"
        with:
          version: ${{ inputs.version }}
          cache-scope: ${{ toJSON(inputs) }}
          is-writer: "true"

      - name: Images by Version/Platform
        id: images-by-platform
        env:
          IS_FORK: ${{ needs.detect.outputs.is-fork }}
          DEV_VERSIONS: ${{ inputs.dev-versions }}
          MATRIX_VERSIONS: ${{ inputs.matrix-versions }}
          BAKERY_CONTEXT: ${{ inputs.context }}
          # pull_request.base.sha for regular PR pushes; merge_group.base_sha
          # for merge-queue runs. base_sha is the real, unmoved tip of the
          # target branch -- head_sha is what carries any PRs stacked ahead
          # of this one in the queue -- so this scopes merge-queue builds to
          # changes the same way production push builds do via event.before.
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          BASE_FLAG=()
          if [ -n "$BASE_REF" ]; then
            BASE_FLAG=(--base-ref "$BASE_REF")
          fi
          FULL_MATRIX=$(bakery ci matrix --quiet --dev-versions "$DEV_VERSIONS" --matrix-versions "$MATRIX_VERSIONS" "${BASE_FLAG[@]}" --context "$BAKERY_CONTEXT" | jq --compact-output .)
          if [ "$IS_FORK" = "true" ]; then
            # Skip arm64 for fork PRs — paid runners may not be available
            FULL_MATRIX=$(echo "$FULL_MATRIX" | jq --compact-output '[.[] | select(.platform != "linux/arm64")]')
          fi
          echo "platform_matrix=$FULL_MATRIX" >> "$GITHUB_OUTPUT"

      - name: Images by Version
        id: images-by-version
        env:
          DEV_VERSIONS: ${{ inputs.dev-versions }}
          MATRIX_VERSIONS: ${{ inputs.matrix-versions }}
          BAKERY_CONTEXT: ${{ inputs.context }}
          # See the "Images by Version/Platform" step above for why this
          # falls back to merge_group.base_sha.
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          BASE_FLAG=()
          if [ -n "$BASE_REF" ]; then
            BASE_FLAG=(--base-ref "$BASE_REF")
          fi
          result=$(bakery ci matrix --quiet --dev-versions "$DEV_VERSIONS" --matrix-versions "$MATRIX_VERSIONS" "${BASE_FLAG[@]}" --exclude platform --context "$BAKERY_CONTEXT")
          echo "versions_matrix=$(echo "$result" | jq --compact-output .)" >> "$GITHUB_OUTPUT"

      - name: Save dependency version cache
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.setup-bakery.outputs.cache-artifact-name }}
          path: /tmp/bakery_cache
          if-no-files-found: ignore
          retention-days: 1

  readme-check:
    name: README Length Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: "posit-dev/images-shared/setup-bakery@main"
        with:
          version: ${{ inputs.version }}

      - name: Check README length
        env:
          DEV_VERSIONS: ${{ inputs.dev-versions }}
          MATRIX_VERSIONS: ${{ inputs.matrix-versions }}
          BAKERY_CONTEXT: ${{ inputs.context }}
        run: |
          bakery ci readme --check \
            --dev-versions "$DEV_VERSIONS" \
            --matrix-versions "$MATRIX_VERSIONS" \
            --context "$BAKERY_CONTEXT"

  build-test:
    name: "Build/Test ${{ matrix.img.image }}:${{ matrix.img.version }} (${{ matrix.img.platform }})"
    needs:
      - detect
      - matrix
    # GitHub Actions fails (not skips) a matrix job when the matrix evaluates to [].
    # Guard here so an empty change-aware matrix produces 'skipped' instead of 'failure'.
    if: ${{ needs.matrix.outputs.platform-matrix != '[]' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        img: ${{ fromJson(needs.matrix.outputs.platform-matrix) }}
    runs-on: ${{ matrix.img.platform == 'linux/arm64' && inputs.arm64-builder || inputs.amd64-builder }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bakery
        uses: "posit-dev/images-shared/setup-bakery@main"
        with:
          version: ${{ inputs.version }}
          cache-scope: ${{ toJSON(inputs) }}

      - name: Setup goss
        uses: "posit-dev/images-shared/setup-goss@main"

      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1  # v5.4.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Setup ORAS CLI
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1

      - name: Login to GitHub Container Registry
        if: needs.detect.outputs.is-fork != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize platform
        id: normalize-platform
        env:
          BUILD_PLATFORM: ${{ matrix.img.platform }}
        run: |
          PLATFORM=${BUILD_PLATFORM#linux/}
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          IS_FORK: ${{ needs.detect.outputs.is-fork }}
          GIT_SHA: ${{ github.sha }}
          RETRY: ${{ inputs.retry }}
          IMAGE_NAME: ${{ matrix.img.image }}
          IMAGE_VERSION: ${{ matrix.img.version }}
          IMAGE_PLATFORM: ${{ matrix.img.platform }}
          IMG_DEV: ${{ matrix.img.dev }}
          MATRIX_VERSIONS: ${{ inputs.matrix-versions }}
          BAKERY_CONTEXT: ${{ inputs.context }}
          CACHE_REGISTRY: ${{ inputs.cache-registry || format('ghcr.io/{0}', github.repository_owner) }}
          CACHE: ${{ inputs.cache }}
          NORMALIZED_PLATFORM: ${{ steps.normalize-platform.outputs.platform }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$IMG_DEV" = "true" ]; then
            DEV_VERSIONS=only
          else
            DEV_VERSIONS=exclude
          fi
          CACHE_FLAGS=()
          if [ "$IS_FORK" != "true" ] && [ "$CACHE" = "true" ]; then
            CACHE_FLAGS=(--cache-registry "$CACHE_REGISTRY")
          fi
          bakery build \
            --strategy build --pull --load \
            --retry "$RETRY" \
            --image-name "^${IMAGE_NAME}$" \
            --image-version "$IMAGE_VERSION" \
            --image-platform "$IMAGE_PLATFORM" \
            --dev-versions "$DEV_VERSIONS" \
            --matrix-versions "$MATRIX_VERSIONS" \
            "${CACHE_FLAGS[@]}" \
            --context "$BAKERY_CONTEXT" \
            --summary --summary-format json \
            > "./${IMAGE_NAME}-${IMAGE_VERSION}-${NORMALIZED_PLATFORM}-summary.json"

      # See the identical step in bakery-build-native.yml's build-test job for why this
      # hash exists: it distinguishes this call's artifacts from a sibling call's when a
      # caller invokes this workflow more than once in the same run (this workflow's own
      # pr.yml callers already do exactly that, once for "production" and once for
      # "development").
      - name: Compute artifact scope
        id: artifact-scope
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          echo "hash=$(printf '%s' "$INPUTS_JSON" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Upload Build Summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: "${{ steps.artifact-scope.outputs.hash }}-${{ matrix.img.image }}-${{ matrix.img.version }}-${{ steps.normalize-platform.outputs.platform }}-summary"
          path: "./${{ matrix.img.image }}-${{ matrix.img.version }}-${{ steps.normalize-platform.outputs.platform }}-summary.json"
          retention-days: 3
          overwrite: 'true'

      - name: Test
        env:
          IMAGE_NAME: ${{ matrix.img.image }}
          IMAGE_VERSION: ${{ matrix.img.version }}
          IMAGE_PLATFORM: ${{ matrix.img.platform }}
          IMG_DEV: ${{ matrix.img.dev }}
          MATRIX_VERSIONS: ${{ inputs.matrix-versions }}
          BAKERY_CONTEXT: ${{ inputs.context }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$IMG_DEV" = "true" ]; then
            DEV_VERSIONS=only
          else
            DEV_VERSIONS=exclude
          fi
          GOSS_PATH=${GITHUB_WORKSPACE}/tools/goss \
          DGOSS_PATH=${GITHUB_WORKSPACE}/tools/dgoss \
          bakery dgoss run \
            --image-name "^${IMAGE_NAME}$" \
            --image-version "$IMAGE_VERSION" \
            --image-platform "$IMAGE_PLATFORM" \
            --dev-versions "$DEV_VERSIONS" \
            --matrix-versions "$MATRIX_VERSIONS" \
            --context "$BAKERY_CONTEXT"

  build-test-result:
    name: Build/Test result
    needs: build-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Report
        env:
          RESULT: ${{ needs.build-test.result }}
        run: |
          # 'skipped' (empty matrix) and 'success' both pass; only real failures block.
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            echo "build-test result: $RESULT"
            exit 1
          fi
          echo "build-test result: $RESULT (ok)"

  summary:
    name: Build Summary
    permissions: {}
    needs: [matrix, build-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install
        uses: "posit-dev/images-shared/setup-bakery@main"
        with:
          version: ${{ inputs.version }}

      - name: Compute artifact scope
        id: artifact-scope
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          echo "hash=$(printf '%s' "$INPUTS_JSON" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Download Build Summaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: "${{ steps.artifact-scope.outputs.hash }}-*-summary"
          merge-multiple: true

      - name: Render Combined Summary
        env:
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
        run: |
          DISCLAIMER=""
          if [ "$BUILD_TEST_RESULT" = "failure" ] || [ "$BUILD_TEST_RESULT" = "cancelled" ]; then
            DISCLAIMER="One or more builds failed or were cancelled. This summary reflects only the targets that completed and is not a complete picture of this run."
          fi
          shopt -s nullglob
          FILES=(./*-summary.json)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No build summaries were produced for this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$DISCLAIMER" ]; then
            bakery ci summary "${FILES[@]}" --output summary.md --disclaimer "$DISCLAIMER"
          else
            bakery ci summary "${FILES[@]}" --output summary.md
          fi
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
