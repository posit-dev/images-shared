# apt.run_setup() / dnf.run_setup() with the Posit Pro and Open repositories.
package:
  ca-certificates:
    installed: true
  curl:
    installed: true
  tar:
    installed: true
{{- if eq .Env.IMAGE_OS_FAMILY "debian" }}
  gnupg:
    installed: true
  locales:
    installed: true
{{- else }}
  gnupg2:
    installed: true
  findutils:
    installed: true
{{- end }}

command:
  posit-pro-repo-registered:
    exec: 'grep -rqs dl.posit.co/public/pro {{ if eq .Env.IMAGE_OS_FAMILY "debian" }}/etc/apt/sources.list.d{{ else }}/etc/yum.repos.d{{ end }}'
    exit-status: 0
  posit-open-repo-registered:
    exec: 'grep -rqs dl.posit.co/public/open {{ if eq .Env.IMAGE_OS_FAMILY "debian" }}/etc/apt/sources.list.d{{ else }}/etc/yum.repos.d{{ end }}'
    exit-status: 0
  package-cache-cleaned:
    exec: '{{ if eq .Env.IMAGE_OS_FAMILY "debian" }}ls -A /var/lib/apt/lists{{ else }}find /var/cache/dnf -name repomd.xml{{ end }} | grep -q .'
    exit-status: 1
{{- if eq .Env.IMAGE_OS_FAMILY "debian" }}
  locale-generated:
    exec: "locale -a"
    exit-status: 0
    stdout:
      - "en_US.utf8"
  locale-exported:
    exec: 'echo "LANG=$LANG LC_ALL=$LC_ALL"'
    exit-status: 0
    stdout:
      - "LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8"

file:
  /etc/apt/apt.conf.d/99-retries:
    exists: true
    contents:
      - 'Acquire::Retries "3";'
{{- end }}
