# Negative blackbox test: building this image must fail because one requested R package
# does not exist. See the "missing R package" scenario in test/features/cli/build.feature.
repository:
  url: "github.com/posit-dev/images-shared"
  vendor: "Posit Software, PBC"
  maintainer:
    name: "Posit Docker Team"
    email: "docker@posit.co"

registries:
  - host: "ghcr.io"
    namespace: "posit-dev"

images:
  - name: "macros-r-missing"
    variants:
      - name: "missing-package"
        primary: true
    versions:
      - name: 1.0.0
        latest: true
        os:
          - name: Ubuntu 24.04
            primary: true
        dependencies:
          - dependency: R
            versions:
              - 4.6.1
